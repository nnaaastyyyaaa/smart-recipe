[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
addopts = -ra --strict-markers
markers =
    unit: юніт-тести (без БД і без мережі)
    component: тести компонентів (API + PostgreSQL + підроблений ШІ)
    system: системні тести (наскрізні сценарії, нефункціональні вимоги)
    performance: перевірки часу відгуку
    req(*ids): ідентифікатори вимог зі специфікації, які перевіряє тест
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
